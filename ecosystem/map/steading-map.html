<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ============================================================
   THE STEADING — map shell
   Chrome is neutral and instrument-like; each style mode
   re-skins it so switching styles reads as a real mode change.
   ============================================================ */

:root{
  /* neutral chrome (light) — a grey biased green, toward the farm accent */
  --bg:        #EFEFEA;
  --surface:   #FBFBF8;
  --surface-2: #F2F2ED;
  --ink:       #1C201D;
  --ink-2:     #565E59;
  --ink-3:     #8A928C;
  --rule:      #DCDFD8;
  --accent:    #2E6F5E;
  --accent-ink:#FFFFFF;
  --focus:     #2E6F5E;
  --shadow:    0 1px 2px rgba(20,28,24,.06), 0 8px 24px rgba(20,28,24,.07);

  --font-ui:   "Archivo", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --font-serif:"EB Garamond", Iowan Old Style, Georgia, serif;

  --stage-bg:  #E7E7E1;
  --panel-font: var(--font-ui);
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:        #141715;
    --surface:   #1C201D;
    --surface-2: #232825;
    --ink:       #EDEFEB;
    --ink-2:     #A7AFA9;
    --ink-3:     #6F776F;
    --rule:      #2E3430;
    --accent:    #6FCBAF;
    --accent-ink:#0E1512;
    --shadow:    0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    --stage-bg:  #101311;
  }
}
:root[data-theme="dark"]{
  --bg:        #141715;
  --surface:   #1C201D;
  --surface-2: #232825;
  --ink:       #EDEFEB;
  --ink-2:     #A7AFA9;
  --ink-3:     #6F776F;
  --rule:      #2E3430;
  --accent:    #6FCBAF;
  --accent-ink:#0E1512;
  --shadow:    0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  --stage-bg:  #101311;
}

/* ---- style modes re-skin the chrome (declared last: they win) ---- */
:root[data-style="blueprint"]{
  --bg:#071322; --surface:#0B1E33; --surface-2:#0E2740; --ink:#D6ECFF; --ink-2:#89B6D8;
  --ink-3:#5A88A8; --rule:#1B3A58; --accent:#5AD2FF; --accent-ink:#04121F;
  --stage-bg:#0A1A2F; --panel-font: var(--font-mono);
  --shadow: 0 0 0 1px rgba(90,210,255,.08), 0 10px 30px rgba(0,0,0,.5);
}
:root[data-style="isometric"]{
  --bg:#E6EADE; --surface:#F7F8F2; --surface-2:#EDF0E5; --ink:#232A1E; --ink-2:#5A6550;
  --ink-3:#8B9480; --rule:#D2D8C6; --accent:#6B8E3F; --accent-ink:#FFFFFF;
  --stage-bg:#D9E3D2; --panel-font: var(--font-ui);
}
:root[data-style="almanac"]{
  --bg:#DCCFAE; --surface:#EFE4C8; --surface-2:#E5D8B8; --ink:#3B2C1E; --ink-2:#6E5B42;
  --ink-3:#977F5E; --rule:#C9B892; --accent:#8E3B2F; --accent-ink:#F6EEDA;
  --stage-bg:#E8DCC0; --panel-font: var(--font-serif);
  --shadow: 0 1px 2px rgba(74,55,40,.12), 0 10px 26px rgba(74,55,40,.14);
}
:root[data-style="neon"]{
  --bg:#03070D; --surface:#080F1A; --surface-2:#0C1725; --ink:#D6FFF4; --ink-2:#6FB9A8;
  --ink-3:#3E7A6E; --rule:#14303F; --accent:#3DF5D0; --accent-ink:#021410;
  --stage-bg:#050B14; --panel-font: var(--font-mono);
  --shadow: 0 0 0 1px rgba(61,245,208,.10), 0 0 40px rgba(61,245,208,.06);
}
:root[data-style="editorial"]{
  --bg:#F3F3F0; --surface:#FCFCFA; --surface-2:#F5F5F2; --ink:#1A1D1C; --ink-2:#5C6663;
  --ink-3:#8D9693; --rule:#DDE2E0; --accent:#2E6F5E; --accent-ink:#FFFFFF;
  --stage-bg:#FCFCFA; --panel-font: var(--font-ui);
}

*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--font-ui); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  transition: background .35s ease, color .35s ease;
}
:focus-visible{ outline:2px solid var(--focus,var(--accent)); outline-offset:2px; border-radius:3px; }

/* ================= layout ================= */
.app{
  height:100%; display:grid;
  grid-template-rows:auto 1fr;
  grid-template-columns:1fr;
}

/* ---- header ---- */
.bar{
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding:10px 16px; padding-top:calc(10px + env(safe-area-inset-top,0px));
  background:var(--surface); border-bottom:1px solid var(--rule);
  position:relative; z-index:6;
}
.brand{ display:flex; align-items:baseline; gap:10px; margin-right:auto; min-width:0; }
.brand h1{
  margin:0; font-size:16px; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
  white-space:nowrap;
}
.brand .sub{ font-size:11.5px; color:var(--ink-3); font-family:var(--font-mono); white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis; }

.tabs{ display:flex; gap:4px; flex-wrap:wrap; }
.tab{
  display:flex; align-items:center; gap:7px; cursor:pointer;
  padding:5px 10px 5px 6px; border:1px solid var(--rule); border-radius:2px;
  background:var(--surface-2); color:var(--ink-2);
  font:500 11.5px/1 var(--font-ui); letter-spacing:.06em; text-transform:uppercase;
  transition:background .18s, color .18s, border-color .18s;
}
.tab:hover{ color:var(--ink); border-color:var(--ink-3); }
.tab[aria-pressed="true"]{ background:var(--ink); color:var(--surface); border-color:var(--ink); }
.tab .chip{ width:16px; height:16px; border-radius:2px; flex:none; box-shadow:inset 0 0 0 1px rgba(0,0,0,.18); }

.toolbtns{ display:flex; gap:4px; }
.tgl{
  cursor:pointer; padding:5px 9px; border:1px solid var(--rule); border-radius:2px;
  background:transparent; color:var(--ink-3);
  font:500 11px/1 var(--font-mono); letter-spacing:.06em; text-transform:uppercase;
}
.tgl[aria-pressed="true"]{ color:var(--accent); border-color:var(--accent); }
.tgl:hover{ color:var(--ink); }

/* ---- main ---- */
.main{ display:grid; grid-template-columns:1fr 340px; min-height:0; }

.stage{
  position:relative; min-width:0; background:var(--stage-bg); overflow:hidden;
  transition:background .35s ease;
}
.stage svg{ display:block; width:100%; height:100%; touch-action:none; cursor:grab; }
.stage svg.dragging{ cursor:grabbing; }

.hud{
  position:absolute; left:12px; bottom:12px; display:flex; gap:6px; align-items:center;
  padding:6px 8px; background:color-mix(in srgb, var(--surface) 88%, transparent);
  border:1px solid var(--rule); border-radius:2px; backdrop-filter:blur(6px);
}
.hud button{
  cursor:pointer; width:26px; height:26px; border:1px solid var(--rule); border-radius:2px;
  background:var(--surface-2); color:var(--ink-2); font:500 13px/1 var(--font-mono);
}
.hud button:hover{ color:var(--ink); }
.hud .zoomval{ font:500 11px/1 var(--font-mono); color:var(--ink-3); min-width:42px; text-align:center;
  font-variant-numeric:tabular-nums; }

.legend{
  position:absolute; right:12px; bottom:12px; padding:9px 11px;
  background:color-mix(in srgb, var(--surface) 88%, transparent);
  border:1px solid var(--rule); border-radius:2px; backdrop-filter:blur(6px);
  display:grid; gap:4px; max-width:210px;
}
.legend h4{ margin:0 0 2px; font:600 10px/1 var(--font-ui); letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3); }
.legend .row{ display:flex; align-items:center; gap:7px; font:400 11px/1.3 var(--font-mono); color:var(--ink-2); }
.legend .dash{ width:16px; height:0; border-top:2px solid; flex:none; }

/* ---- tooltip ---- */
.tip{
  position:absolute; pointer-events:none; z-index:5; opacity:0; transform:translate(-50%,-140%);
  padding:5px 9px; background:var(--ink); color:var(--surface); border-radius:2px;
  font:500 11.5px/1.3 var(--font-ui); white-space:nowrap; transition:opacity .12s;
}
.tip.on{ opacity:1; }
.tip .k{ font-family:var(--font-mono); opacity:.66; font-size:10.5px; }

/* ---- panel ---- */
.panel{
  border-left:1px solid var(--rule); background:var(--surface);
  overflow-y:auto; overscroll-behavior:contain; min-height:0;
  font-family:var(--panel-font);
}
.panel-in{ padding:18px 18px calc(28px + env(safe-area-inset-bottom,0px)); display:grid; gap:18px; }

.eyebrow{
  font:600 10px/1 var(--font-ui); letter-spacing:.16em; text-transform:uppercase; color:var(--ink-3);
  display:flex; align-items:center; gap:7px;
}
.eyebrow .dot{ width:9px; height:9px; border-radius:50%; flex:none; }

.ptitle{ margin:6px 0 0; font:700 21px/1.18 var(--font-ui); letter-spacing:-.01em; text-wrap:balance; }
:root[data-style="almanac"] .ptitle{ font-family:var(--font-serif); font-weight:600; font-size:24px; }
.psub{ margin:2px 0 0; font:400 12px/1.4 var(--font-mono); color:var(--ink-3); }
.pbody{ margin:0; font-size:13.5px; line-height:1.62; color:var(--ink-2); max-width:60ch; }

.block{ display:grid; gap:7px; }
.block h3{
  margin:0; font:600 10px/1 var(--font-ui); letter-spacing:.16em; text-transform:uppercase;
  color:var(--ink-3); padding-bottom:6px; border-bottom:1px solid var(--rule);
}
.lst{ margin:0; padding:0; list-style:none; display:grid; gap:5px; }
.lst li{ font-size:13px; line-height:1.5; color:var(--ink-2); padding-left:14px; position:relative; }
.lst li::before{ content:""; position:absolute; left:0; top:.58em; width:5px; height:1px; background:var(--ink-3); }

.warn{
  padding:10px 12px; border-left:2px solid var(--accent); background:var(--surface-2);
  font-size:12.5px; line-height:1.55; color:var(--ink-2);
}
.warn b{ color:var(--ink); font-weight:600; display:block; margin-bottom:3px;
  font:600 10px/1 var(--font-ui); letter-spacing:.14em; text-transform:uppercase; }

.chips{ display:flex; flex-wrap:wrap; gap:5px; }
.chipbtn{
  cursor:pointer; border:1px solid var(--rule); background:var(--surface-2); color:var(--ink-2);
  border-radius:2px; padding:5px 9px; font:500 11.5px/1.2 var(--font-ui); text-align:left;
}
.chipbtn:hover{ border-color:var(--accent); color:var(--ink); }

.rolecard{
  border:1px solid var(--rule); border-radius:2px; background:var(--surface-2);
  padding:11px 12px; display:grid; gap:6px;
}
.rolecard .rhead{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
.rolecard .rname{ font:600 14px/1.2 var(--font-ui); color:var(--ink); }
.rolecard .rtitle{ font:400 11px/1.3 var(--font-mono); color:var(--ink-3); }
.rolecard .rchart{ font-size:12.5px; line-height:1.55; color:var(--ink-2); }
.tier{
  font:600 9.5px/1 var(--font-ui); letter-spacing:.12em; text-transform:uppercase;
  padding:3px 6px; border-radius:2px; flex:none; color:#fff;
}

.taskrow{ display:grid; gap:3px; padding:9px 0; border-bottom:1px solid var(--rule); }
.taskrow:last-child{ border-bottom:0; }
.taskrow .tn{ font:600 13px/1.3 var(--font-ui); color:var(--ink); }
.taskrow .tm{ font:400 11.5px/1.45 var(--font-mono); color:var(--ink-3); }
.taskrow .tm b{ color:var(--ink-2); font-weight:500; }

.kv{ display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-size:12.5px; }
.kv dt{ font:500 10px/1.5 var(--font-ui); letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); }
.kv dd{ margin:0; color:var(--ink-2); }

/* ---- roster overlay ---- */
.roster{
  position:fixed; inset:0; z-index:20; background:var(--bg);
  overflow-y:auto; padding:0 16px calc(40px + env(safe-area-inset-bottom,0px));
}
.roster-in{ max-width:1180px; margin:0 auto; padding-block:28px; }
.roster h2{ margin:0 0 4px; font:700 26px/1.1 var(--font-ui); letter-spacing:-.015em; }
.roster .rlead{ margin:0 0 26px; color:var(--ink-2); font-size:14px; max-width:62ch; }
.rzone{ margin-bottom:30px; }
.rzone > h3{
  margin:0 0 10px; padding-bottom:7px; border-bottom:1px solid var(--rule);
  display:flex; align-items:center; gap:9px;
  font:600 12px/1 var(--font-ui); letter-spacing:.14em; text-transform:uppercase;
}
.rgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:10px; }
.closeR{
  position:sticky; top:env(safe-area-inset-top,0px); float:right; z-index:2;
  cursor:pointer; border:1px solid var(--rule); background:var(--surface); color:var(--ink);
  padding:7px 13px; border-radius:2px; font:500 11.5px/1 var(--font-ui);
  letter-spacing:.08em; text-transform:uppercase;
}

/* ---- responsive ---- */
@media (max-width: 900px){
  .main{ grid-template-columns:1fr; grid-template-rows:minmax(300px,1fr) auto; }
  .panel{ border-left:0; border-top:1px solid var(--rule); max-height:46vh; }
  .brand .sub{ display:none; }
  .legend{ display:none; }
}
@media (max-width: 560px){
  .bar{ gap:9px; padding:9px 12px; padding-top:calc(9px + env(safe-area-inset-top,0px)); }
  .brand h1{ font-size:14px; }
  .tab span.lab{ display:none; }
  .tab{ padding:5px 6px; }
}
@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.001ms !important; animation-iteration-count:1 !important;
     transition-duration:.001ms !important; }
}

/* ---- pick targets ---- */
.pickable{ cursor:pointer; }
.pickable > *{ transition:filter .15s ease; }
.pickable:hover > *{ filter:brightness(1.12) saturate(1.15); }
:root[data-style="neon"] .pickable:hover > *{ filter:brightness(1.5); }
:root[data-style="blueprint"] .pickable:hover > *{ filter:brightness(1.45); }
.pickable:focus{ outline:none; }
.pickable.sel > *{ filter:brightness(1.18) saturate(1.2); }
.selring{ pointer-events:none; }

/* ---- live agents ---- */
.livepill{
  display:inline-block; margin-left:7px; vertical-align:2px;
  font:600 8.5px/1 var(--font-ui); letter-spacing:.12em; text-transform:uppercase;
  padding:3px 5px; border-radius:2px; background:var(--accent); color:var(--accent-ink);
}
.rolecard.live{ border-left:2px solid var(--accent); }
.agentline{
  font:500 11px/1 var(--font-mono); color:var(--accent);
  letter-spacing:.04em;
}

</style>

<div class="app">
  <header class="bar">
    <div class="brand">
      <h1>The Steading</h1>
      <span class="sub" id="styleNote"></span>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="Map style"></div>
    <div class="toolbtns" id="toggles"></div>
    <button class="tgl" id="rosterBtn" type="button">Roster</button>
  </header>

  <div class="main">
    <div class="stage" id="stage">
      <div class="tip" id="tip"></div>
      <div class="hud">
        <button id="zout" type="button" aria-label="Zoom out">&minus;</button>
        <span class="zoomval" id="zoomval">100%</span>
        <button id="zin" type="button" aria-label="Zoom in">+</button>
        <button id="zfit" type="button" aria-label="Reset view">⌂</button>
      </div>
      <div class="legend">
        <h4>Channels</h4>
        <div id="legendRows"></div>
      </div>
    </div>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </div>
</div>


<script>window.WORLD = {"$schema":"./schema/world.schema.json","id":"steading","name":"The Steading","tagline":"An AI agent ecosystem, mapped as a working farm.","version":"0.1.0","status":"earning","note":"15 of the 51 roles are live as Claude Code subagents in .claude/agents/, working today with no API keys. The Market is the only zone that faces a customer — it is where the farm stops costing money and starts making it. The rest are charters.","grid":{"width":100,"height":70,"unit":"chain"},"modelTiers":{"steward":{"label":"Steward","model":"claude-opus-5","use":"Owns outcomes. Plans, decomposes, arbitrates, decides when to stop.","color":"#C9A227"},"specialist":{"label":"Specialist","model":"claude-opus-5","use":"Deep single-domain judgment. Quality bar matters more than cost.","color":"#6C8E4F"},"hand":{"label":"Hand","model":"claude-sonnet-5","use":"Bulk execution under a clear spec. The workhorses.","color":"#5B7FA6"},"sorter":{"label":"Sorter","model":"claude-haiku-4-5","use":"Classify, route, extract, score. High volume, low ceremony.","color":"#9A6A4F"}},"flowKinds":{"task":{"label":"Task","desc":"A unit of work moving toward whoever will do it.","color":"#D98A3A"},"artifact":{"label":"Artifact","desc":"Produced output moving toward storage or delivery.","color":"#6C8E4F"},"memory":{"label":"Memory","desc":"Facts, episodes, and procedures moving in or out of store.","color":"#8A6FB0"},"signal":{"label":"Signal","desc":"Telemetry, health, and cost moving toward the watch.","color":"#4E93A8"},"control":{"label":"Control","desc":"Authority: permits, kills, budgets, escalations.","color":"#C2413C"}},"zones":[{"id":"farmhouse","name":"The Farmhouse","subtitle":"Command Yard","domain":"Orchestration","charter":"Receives intent from the outside world, turns it into a plan, and decides who does what. Nothing self-assigns on this farm; work is handed out here.","owns":["Goal intake","Task decomposition","Assignment and routing","Priority and backpressure","The single work ledger"],"failsWhen":"It holds context for every worker at once and runs out of room to think. Past four concurrent crews, delegate to a Row Boss instead of tracking rows yourself.","color":"#C2823C","accent":"#F0C27B","icon":"house","branch":"claude/steading-farmhouse","polygon":[[30,26],[44,24],[54,27],[54,40],[48,44],[34,44],[30,38]]},{"id":"fields","name":"The Fields","subtitle":"The Rows","domain":"Execution","charter":"Where the actual labour happens, in parallel rows. A field runs one kind of work at scale: prepare, generate, extract, reduce. Rows do not talk to each other.","owns":["Bulk generation","Extraction and parsing","Reduction and synthesis","Retry of dropped work","Per-batch sub-orchestration"],"failsWhen":"Rows are given work that depends on other rows. Independence is the whole reason the field is fast; a dependency between rows turns a field into a queue.","color":"#6C8E4F","accent":"#A8C87A","icon":"field","branch":"claude/steading-fields","polygon":[[5,31],[28,30],[28,50],[26,64],[8,64],[4,52]]},{"id":"barn","name":"The Barn","subtitle":"Barnyard","domain":"Long-running & stateful agents","charter":"Home to everything that stays alive between requests: durable sessions, scheduled jobs, and the supervisors that keep them honest. Fields forget; the barn remembers.","owns":["Durable agent sessions","Scheduled and recurring work","Liveness and health checks","Timeout, runaway and kill-switch supervision","Workspace and container lifecycle"],"failsWhen":"A long-running agent is left unsupervised. Anything that can run for an hour can loop for an hour — the Sheepdog is not optional.","color":"#A0522D","accent":"#D98A5A","icon":"barn","branch":"claude/steading-barn","polygon":[[58,29],[74,28],[84,32],[84,45],[76,48],[62,48],[58,41]]},{"id":"silo","name":"The Silo Row","subtitle":"Granary","domain":"Memory & knowledge","charter":"Four kinds of remembering, kept in four separate stores on purpose. Mixing them is the most common reason an agent ecosystem slowly goes senile.","owns":["Working memory (this task)","Episodic memory (what happened)","Semantic memory (what is true)","Procedural memory (how we do it)","Archive, retention and deletion"],"failsWhen":"Everything is thrown into one vector store. Vectors are good at 'something like this' and bad at 'what happened, in what order' — keep the trace separate from the facts.","color":"#8A6FB0","accent":"#BCA5DA","icon":"silo","branch":"claude/steading-silo","polygon":[[72,6],[92,5],[96,12],[96,24],[88,27],[76,26],[72,18]]},{"id":"toolshed","name":"The Toolshed","subtitle":"Works Yard","domain":"Tools & integrations","charter":"Every capability an agent has, it got from here. Tools are built, sharpened, catalogued and handed out — and taken away again when they go dull.","owns":["Tool and MCP server construction","External API adapters","Tool schemas and descriptions","The tool registry and who may hold what","Deprecation and removal"],"failsWhen":"Tools accumulate and nothing is ever retired. A crowded toolbelt costs context on every single call and makes the right tool harder to pick.","color":"#5B7FA6","accent":"#8FB6D6","icon":"shed","branch":"claude/steading-toolshed","polygon":[[62,53],[80,51],[94,54],[94,64],[86,67],[66,66],[62,60]]},{"id":"greenhouse","name":"The Greenhouse","subtitle":"Nursery","domain":"R&D and evaluation","charter":"Nothing reaches a field untested. New prompts, new agents and new tools are grown here under glass, graded against real data, and only then transplanted.","owns":["Prompt design and tuning","New agent incubation in sandbox","Eval sets and golden data","Grading, rubrics and LLM judges","Pruning what no longer earns its place"],"failsWhen":"The eval set is written from the same head that wrote the prompt. Golden data has to come from real traffic or it only measures your own assumptions.","color":"#3F8F6F","accent":"#7FD1AE","icon":"greenhouse","branch":"claude/steading-greenhouse","polygon":[[5,6],[24,5],[28,11],[28,23],[20,26],[9,25],[5,17]]},{"id":"watchtower","name":"The Watchtower","subtitle":"The Ridge","domain":"Observability","charter":"Sits on the high ground and can see every zone at once. If it did not happen in a trace here, it did not happen — and nobody will be able to explain it later.","owns":["End-to-end traces and causality","Cost and token accounting","Load and anomaly forecasting","Alerting and paging a human","Quality reporting and SLOs"],"failsWhen":"Logging records that an agent ran but not why it decided what it decided. A timestamp is not a trace; capture the reasoning and the inputs it saw.","color":"#4E93A8","accent":"#8ED0E0","icon":"tower","branch":"claude/steading-watchtower","polygon":[[38,5],[56,4],[62,9],[62,19],[54,22],[42,21],[38,13]]},{"id":"gatehouse","name":"The Gatehouse","subtitle":"South Gate","domain":"Security & the outside world","charter":"The only lawful way in or out. Every request from outside is identified here, every artifact leaving is inspected here, and the fence line is everyone's business.","owns":["Identity and scopes","Sandboxing and blast radius","Rate limiting and fair share","Outbound inspection for secrets and PII","The external interface humans actually touch"],"failsWhen":"The fence is treated as the gate's problem alone. Egress from a field row is a hole in the fence no matter how well the gate is staffed.","color":"#C2413C","accent":"#E8837E","icon":"gate","branch":"claude/steading-gatehouse","polygon":[[36,51],[52,50],[60,54],[60,66],[52,68],[40,68],[36,60]]},{"id":"market","name":"The Market","subtitle":"The Wayside","domain":"Finding and winning work","charter":"The only zone that faces a customer. Everything else on this farm spends money; this one brings it in. Its whole method is to do the work before asking for it — arrive holding a finished diagnostic rather than a pitch.","owns":["Finding prospects with a verifiable problem","Qualifying who can actually pay","The diagnostic that becomes the free artifact","Outreach and follow-up","Pricing and quotes","Delivery and retention"],"failsWhen":"It leads with the agent instead of the outcome. Nobody buys 'an AI audit'; they buy 'your phone number is not tappable and you are losing calls'. The moment the pitch is about how the work was done, the work stops being worth paying for.","color":"#B8860B","accent":"#E8C468","icon":"stall","branch":"claude/steading-market","polygon":[[85,30],[93,29],[97,33],[97,47],[93,51],[86,50],[85,42]]}],"stations":[{"id":"gh-glasshouse","zone":"greenhouse","name":"The Glasshouse","kind":"greenhouse","x":13,"y":12,"w":9,"h":6,"purpose":"Where a new agent is grown from a prompt into something that survives contact with real input.","inputs":["A job nobody currently does","Failed traces showing a gap","Golden examples of the wanted output"],"outputs":["A drafted role charter","A tuned system prompt","A sandbox transcript showing it works"],"tasks":["t-draft-role","t-tune-prompt"]},{"id":"gh-beds","zone":"greenhouse","name":"The Nursery Beds","kind":"beds","x":22,"y":10,"w":8,"h":5,"purpose":"Candidate agents run against real traffic in shadow mode — they produce output, nobody acts on it.","inputs":["A candidate agent","A mirrored slice of live work"],"outputs":["Shadow transcripts","A first honest failure rate"],"tasks":["t-shadow-run"]},{"id":"gh-bench","zone":"greenhouse","name":"The Grading Bench","kind":"shed","x":9,"y":20,"w":8,"h":5,"purpose":"Scoring. Rubrics, judges and the eval sets that decide whether anything actually improved.","inputs":["Candidate output","The golden set","A written rubric"],"outputs":["A score with a breakdown","A pass or fail against the bar","New eval cases harvested from failures"],"tasks":["t-score-run","t-curate-evalset"]},{"id":"gh-frames","zone":"greenhouse","name":"The Cold Frames","kind":"frames","x":22,"y":20,"w":8,"h":5,"purpose":"Hardening off. A passing agent takes a small percentage of real work before it takes all of it.","inputs":["An agent that passed the bench","A traffic percentage"],"outputs":["A staged rollout","A rollback if the live numbers disagree with the bench"],"tasks":["t-stage-rollout"]},{"id":"wt-tower","zone":"watchtower","name":"The Tower","kind":"tower","x":50,"y":10,"w":7,"h":9,"purpose":"Every run, end to end, with the reasoning attached. The only place the whole farm is visible at once.","inputs":["Spans from every zone","Inputs each agent actually saw","Decisions and their stated reasons"],"outputs":["A replayable trace per run","The causal chain behind any single output"],"tasks":["t-trace-run","t-replay-failure"]},{"id":"wt-mill","zone":"watchtower","name":"The Windmill","kind":"windmill","x":41,"y":15,"w":6,"h":8,"purpose":"Reads which way the load is blowing. Forecasts demand and flags anomalies before they become incidents.","inputs":["Historical throughput","Queue depth","Live error rates"],"outputs":["A load forecast","Anomaly flags","Advice to the Dispatcher on how hard to run"],"tasks":["t-forecast-load"]},{"id":"wt-bell","zone":"watchtower","name":"The Bell Post","kind":"bell","x":57,"y":7,"w":5,"h":5,"purpose":"Wakes a human. Deliberately hard to ring, because a bell that rings often stops being heard.","inputs":["A breached threshold","A stuck or looping agent","A budget overrun"],"outputs":["A page with the trace link attached","An incident record"],"tasks":["t-raise-alarm"]},{"id":"wt-tally","zone":"watchtower","name":"The Tally Office","kind":"shed","x":58,"y":16,"w":8,"h":5,"purpose":"Counts what everything cost. Tokens, calls, wall time, and cost per completed task — not per request.","inputs":["Token usage per span","Per-zone budgets"],"outputs":["Cost per task and per zone","Budget burn-down","The stop order when a budget is spent"],"tasks":["t-account-spend"]},{"id":"si-working","zone":"silo","name":"Silo I — Working","kind":"silo","x":77,"y":11,"w":5,"h":11,"purpose":"This task, right now. Scratch state for a run in flight; emptied when the run ends.","inputs":["Intermediate results","Partial plans","Tool outputs still in play"],"outputs":["Current state to whoever is working","A handoff packet when work changes hands"],"tasks":["t-checkpoint-state"]},{"id":"si-episodic","zone":"silo","name":"Silo II — Episodic","kind":"silo","x":84,"y":10,"w":5,"h":11,"purpose":"What happened, in what order, with timestamps. The thing vector search is worst at and you need most when debugging.","inputs":["Ordered event records","Tool calls with their arguments and results"],"outputs":["Run histories","The raw material the Winnower distills into facts"],"tasks":["t-record-episode"]},{"id":"si-semantic","zone":"silo","name":"Silo III — Semantic","kind":"silo","x":91,"y":11,"w":5,"h":11,"purpose":"What is true, independent of when we learned it. Facts, preferences, domain rules, distilled conclusions.","inputs":["Facts promoted from episodes","Human-asserted ground truth"],"outputs":["Retrieved context for any agent that asks","Contradictions flagged for a human"],"tasks":["t-promote-fact","t-retrieve-context"]},{"id":"si-granary","zone":"silo","name":"The Granary","kind":"granary","x":80,"y":20,"w":9,"h":6,"purpose":"Procedural memory — how we do things. Versioned prompts, role charters, rubrics and agent blueprints.","inputs":["Promoted prompts from the Greenhouse","Rubrics that held up","Role definitions"],"outputs":["The seed any new agent is grown from","A diffable history of every prompt change"],"tasks":["t-version-prompt"]},{"id":"si-cellar","zone":"silo","name":"The Root Cellar","kind":"cellar","x":91,"y":22,"w":7,"h":5,"purpose":"Cold storage. Retention windows, legal holds, and the only place on the farm authorised to delete.","inputs":["Aged-out episodes","Deletion requests"],"outputs":["Archived records","Proof of deletion"],"tasks":["t-age-out"]},{"id":"fh-house","zone":"farmhouse","name":"The Farmhouse","kind":"farmhouse","x":37,"y":31,"w":11,"h":8,"purpose":"The Farmer's seat. Intent arrives, becomes a plan, and the plan becomes named chores with owners.","inputs":["A goal from the Gatehouse","Current farm capacity","What the Almanac says was tried before"],"outputs":["A written plan","A decomposition into independent chores","A decision to stop"],"tasks":["t-intake-goal","t-decompose","t-decide-done"]},{"id":"fh-board","zone":"farmhouse","name":"The Chore Board","kind":"board","x":45,"y":34,"w":7,"h":5,"purpose":"Every open chore on one board, with an owner and a state. If it is not on the board it is not happening.","inputs":["Chores from the Farmhouse","State changes from every zone"],"outputs":["The authoritative work ledger","What is blocked and on whom"],"tasks":["t-post-chore","t-claim-chore"]},{"id":"fh-well","zone":"farmhouse","name":"The Well","kind":"well","x":51,"y":29,"w":5,"h":5,"purpose":"The shared resource everybody draws from: model capacity, rate limit headroom, budget. Finite, and visibly so.","inputs":["Provider rate limits","The month's budget"],"outputs":["Draw permits per zone","A dry-well signal that throttles the whole farm"],"tasks":["t-ration-draw"]},{"id":"fh-porch","zone":"farmhouse","name":"The Dispatch Porch","kind":"porch","x":34,"y":40,"w":8,"h":5,"purpose":"Where chores are matched to crews. Priority, batching, backpressure, and the call on which tier does the work.","inputs":["The board","Crew capacity","The Windmill's forecast"],"outputs":["Assignments","A held queue when the farm is full"],"tasks":["t-route-chore","t-apply-backpressure"]},{"id":"fh-ledger","zone":"farmhouse","name":"The Ledger Office","kind":"shed","x":47,"y":41,"w":8,"h":5,"purpose":"Writes down what was decided and why, so tomorrow's Farmer does not redo today's thinking.","inputs":["Decisions from the Farmhouse","Outcomes from every zone"],"outputs":["A decision record per plan","Episodes handed to the Silo"],"tasks":["t-write-decision"]},{"id":"bn-barn","zone":"barn","name":"The Great Barn","kind":"barn","x":66,"y":35,"w":13,"h":9,"purpose":"Durable agent sessions that live across many turns and many days. Each has a stall, a name and a keeper.","inputs":["A long-horizon assignment","Session state from Silo I"],"outputs":["Progress across days","A session that can be resumed, inspected or ended"],"tasks":["t-open-session","t-resume-session"]},{"id":"bn-paddock","zone":"barn","name":"The Paddock","kind":"paddock","x":77,"y":34,"w":9,"h":7,"purpose":"Open ground for agents that are running but not currently working — warm, idle, cheap to wake.","inputs":["Idle sessions","Wake triggers"],"outputs":["Fast resume without a cold start","Sessions retired when nobody comes for them"],"tasks":["t-park-session"]},{"id":"bn-coop","zone":"barn","name":"The Henhouse","kind":"coop","x":61,"y":44,"w":7,"h":5,"purpose":"Scheduled work that lays on a cadence — nightly digests, hourly polls, weekly reports.","inputs":["A cron expression","A standing instruction"],"outputs":["A run per firing","A skipped-run record when the farm is throttled"],"tasks":["t-schedule-job","t-fire-scheduled"]},{"id":"bn-kennel","zone":"barn","name":"The Kennel","kind":"kennel","x":72,"y":45,"w":7,"h":5,"purpose":"Home of the Sheepdog. Watches every long-running agent for the three ways they go wrong: stuck, looping, or wandering off-task.","inputs":["Heartbeats","Step counts","The original assignment to compare against"],"outputs":["A nudge back on task","A timeout","A kill, with the reason recorded"],"tasks":["t-herd-stray","t-kill-runaway"]},{"id":"bn-vet","zone":"barn","name":"The Vet Stall","kind":"shed","x":81,"y":42,"w":8,"h":5,"purpose":"Health, not behaviour. Is this agent responding, is its context poisoned, has its quality drifted since last week?","inputs":["Liveness probes","Rolling quality scores","Context size over time"],"outputs":["A clean bill of health","A restart","A referral back to the Greenhouse"],"tasks":["t-health-check","t-detect-drift"]},{"id":"fd-north","zone":"fields","name":"North Field — Sowing","kind":"field","x":14,"y":36,"w":20,"h":8,"rows":6,"purpose":"First-pass generation at volume. Drafts, candidates, options — quantity here, quality downstream.","inputs":["A chore with a clear spec","Context retrieved from Silo III"],"outputs":["Draft artifacts, many of them","A per-row confidence note"],"tasks":["t-generate-draft"]},{"id":"fd-east","zone":"fields","name":"East Field — Reaping","kind":"field","x":14,"y":45,"w":20,"h":8,"rows":6,"purpose":"Extraction and parsing. Turning unstructured input into the schema the rest of the farm can handle.","inputs":["Raw documents, pages, transcripts","A target schema"],"outputs":["Validated structured records","A rejects pile for the Gleaner"],"tasks":["t-extract-structured"]},{"id":"fd-south","zone":"fields","name":"South Field — Threshing","kind":"field","x":14,"y":54,"w":20,"h":8,"rows":6,"purpose":"Reduction. Many inputs become one output: synthesis, merge, summary, ranking.","inputs":["The output of many rows","A merge rule"],"outputs":["One coherent artifact","A record of what was dropped and why"],"tasks":["t-reduce-merge"]},{"id":"fd-fallow","zone":"fields","name":"Fallow Field — Gleaning","kind":"field","x":14,"y":61,"w":20,"h":6,"rows":4,"purpose":"Second pass over everything the other fields dropped, failed or timed out on. Nothing leaves the farm unaccounted for.","inputs":["The rejects pile","Timed-out rows","Partial results"],"outputs":["Recovered work","A permanent-failure record when recovery is not possible"],"tasks":["t-glean-failures"]},{"id":"fd-head","zone":"fields","name":"The Irrigation Head","kind":"pump","x":6,"y":48,"w":5,"h":6,"purpose":"Feeds context into the rows at a controlled rate. Decides how much each row gets to see — the single biggest cost lever on the farm.","inputs":["Retrieved context","Per-row context budget"],"outputs":["A trimmed, ordered context packet per row","A cache-stable prefix"],"tasks":["t-meter-context"]},{"id":"fd-compost","zone":"fields","name":"The Compost Heap","kind":"compost","x":24,"y":61,"w":7,"h":5,"purpose":"Failures rot down into something useful. Every permanent failure becomes an eval case before it is forgotten.","inputs":["Permanent failures","Traces of what went wrong"],"outputs":["New cases for the Grading Bench","Patterns worth a prompt change"],"tasks":["t-compost-failure"]},{"id":"fd-crow","zone":"fields","name":"The Scarecrow Post","kind":"scarecrow","x":25,"y":34,"w":4,"h":6,"purpose":"Stands at the field edge and keeps bad input out. Prompt injection, junk, and anything trying to redirect a row's task.","inputs":["Everything arriving at a field row"],"outputs":["Clean input","A quarantined item and a note to the Watchtower"],"tasks":["t-screen-input"]},{"id":"ts-shed","zone":"toolshed","name":"The Toolshed","kind":"shed","x":69,"y":57,"w":10,"h":6,"purpose":"The tool catalogue. What exists, what it does, what it costs, and which roles are allowed to pick it up.","inputs":["New tools from the Smithy","Usage data from the Watchtower"],"outputs":["The registry","A per-role toolbelt","A deprecation notice"],"tasks":["t-register-tool","t-issue-toolbelt"]},{"id":"ts-smithy","zone":"toolshed","name":"The Smithy","kind":"smithy","x":80,"y":56,"w":9,"h":6,"purpose":"Tools are forged here. Function tools, MCP servers, and the adapters that make a stubborn external API behave.","inputs":["A capability gap named by a zone","An external API's documentation"],"outputs":["A working tool with a tested schema","An MCP server","Its failure modes, written down"],"tasks":["t-forge-tool","t-write-tool-schema"]},{"id":"ts-yard","zone":"toolshed","name":"The Tractor Yard","kind":"tractor","x":88,"y":61,"w":8,"h":6,"purpose":"Heavy machinery: code execution, batch runs, the sandbox where a tool can do real damage cheaply.","inputs":["A job too big or too risky for a normal row"],"outputs":["Batch results","A sandboxed execution record"],"tasks":["t-run-batch"]},{"id":"ts-hut","zone":"toolshed","name":"The Quartermaster's Hut","kind":"hut","x":66,"y":64,"w":7,"h":5,"purpose":"Signs tools in and out. A role holds only the tools its current chore needs, and gives them back afterwards.","inputs":["A chore and its assigned role"],"outputs":["A scoped, time-boxed toolbelt","An audit line for every issue and return"],"tasks":["t-scope-tools"]},{"id":"gt-gate","zone":"gatehouse","name":"The Gatehouse","kind":"gate","x":48,"y":62,"w":10,"h":7,"purpose":"The only lawful entrance. Identifies who is asking, what they may ask for, and hands the request to the Farmhouse.","inputs":["External requests","Credentials and scopes"],"outputs":["An authenticated, scoped goal","A refusal with a reason"],"tasks":["t-authenticate","t-scope-request"]},{"id":"gt-fence","zone":"gatehouse","name":"The Fence Line","kind":"fence","x":39,"y":55,"w":8,"h":5,"purpose":"Blast radius. Network egress, filesystem reach and credential scope for every zone — the fence is checked from the inside.","inputs":["Per-zone isolation policy"],"outputs":["Enforced sandbox boundaries","A breach alarm"],"tasks":["t-enforce-sandbox"]},{"id":"gt-stall","zone":"gatehouse","name":"The Market Stall","kind":"stall","x":57,"y":58,"w":8,"h":6,"purpose":"What the outside world actually sees and touches. Delivery of finished artifacts, in the form the asker wanted.","inputs":["Finished artifacts","The original request's delivery preference"],"outputs":["The delivered result","A receipt linked to its trace"],"tasks":["t-deliver-artifact"]},{"id":"gt-scale","zone":"gatehouse","name":"The Weigh Station","kind":"scale","x":40,"y":65,"w":8,"h":5,"purpose":"Nothing leaves unweighed. Outbound inspection for secrets, PII, policy violations and claims the farm cannot support.","inputs":["Every artifact bound for the outside"],"outputs":["A cleared artifact","A redaction","A block, with the reason recorded"],"tasks":["t-inspect-outbound"]},{"id":"mk-wayside","zone":"market","name":"The Wayside","kind":"board","x":90,"y":33,"w":8,"h":4,"purpose":"Where you stand at the road and watch who goes past. Prospects are found here — businesses with a problem you can name and prove before you ever speak to them.","inputs":["A trade and a geography","A problem that is checkable from outside"],"outputs":["A prospect list with a named, verifiable defect each","The ones not worth approaching, and why"],"tasks":["t-find-prospects","t-build-list"]},{"id":"mk-bench","zone":"market","name":"The Assay Bench","kind":"shed","x":90,"y":38.5,"w":9,"h":4.5,"purpose":"Where a prospect's problem is measured rather than asserted. The output is the artifact you hand over — it has to be right, because it is the entire argument for paying you.","inputs":["A qualified prospect","Their public web presence"],"outputs":["A scored audit naming each defect, what it costs, and the fix","A note when there is nothing worth fixing"],"tasks":["t-run-audit","t-write-report"]},{"id":"mk-book","zone":"market","name":"The Order Book","kind":"hut","x":90,"y":43.5,"w":8,"h":4,"purpose":"The pipeline. Who was found, who was approached, who replied, who paid, and who is due a follow-up. Without it the whole zone runs on memory and loses people.","inputs":["Prospects","Responses","Delivered work"],"outputs":["A pipeline with a next action and a date on every row","Pricing decisions and the reasoning behind them"],"tasks":["t-qualify-lead","t-price-work","t-track-pipeline"]},{"id":"mk-stand","zone":"market","name":"The Market Stand","kind":"stall","x":90,"y":48,"w":9,"h":4.5,"purpose":"Where the farm meets a stranger. The approach is made here, the work is delivered here, and the relationship is kept here — which is worth more than any single sale.","inputs":["A finished audit","A cleared artifact from the Weigh Station"],"outputs":["An approach, in the prospect's language","Delivered work and a receipt","A renewal, or an honest close"],"tasks":["t-make-approach","t-follow-up","t-deliver-fix"]}],"roles":[{"id":"r-farmer","name":"The Farmer","title":"Prime Orchestrator","zone":"farmhouse","station":"fh-house","tier":"steward","charter":"Owns the outcome of everything the farm is asked to do. The only role permitted to decide that a job is finished.","duties":["Take in a goal and restate it in the farm's own terms","Choose the shape of the work before choosing who does it","Break a goal into chores that do not depend on each other","Arbitrate when two zones disagree","Call the job done, or call it impossible"],"reads":["The goal from the Gatehouse","Silo III for what is already known","The Granary for how this was done last time"],"writes":["The plan","The decomposition","The decision record"],"escalatesTo":"A human, via the Bell Post","agent":"farmer"},{"id":"r-foreman","name":"The Foreman","title":"Task Router","zone":"farmhouse","station":"fh-porch","tier":"steward","charter":"Matches chores to crews. Knows what each zone is good at and what it currently has capacity for.","duties":["Choose the zone and the tier for each chore","Batch related chores so context is reused","Hold work back when the farm is full","Re-route when a crew fails twice"],"reads":["The Chore Board","Crew capacity","The Windmill's forecast"],"writes":["Assignments","The held queue"],"escalatesTo":"r-farmer"},{"id":"r-ledger","name":"The Ledger Keeper","title":"Work-State Authority","zone":"farmhouse","station":"fh-board","tier":"hand","charter":"Holds the one true list of what is open, who owns it, and what it is waiting on. Everyone else reads this; nobody else writes it.","duties":["Post every chore with an owner and a state","Record state transitions and refuse illegal ones","Surface what is blocked and on whom","Never let a chore vanish silently"],"reads":["State changes from every zone"],"writes":["The work ledger"],"escalatesTo":"r-foreman"},{"id":"r-dispatcher","name":"The Dispatcher","title":"Queue & Backpressure Manager","zone":"farmhouse","station":"fh-porch","tier":"sorter","charter":"Decides the order things happen in and says no when the farm is at capacity.","duties":["Order the queue by priority and age","Apply backpressure rather than accepting work that will time out","Fan out independent chores in parallel","Collapse duplicate chores"],"reads":["The queue","The Well's draw permits"],"writes":["Dispatch order","Rejection notices with a retry-after"],"escalatesTo":"r-foreman"},{"id":"r-almanac","name":"The Almanac Reader","title":"Long-Horizon Planner","zone":"farmhouse","station":"fh-house","tier":"specialist","charter":"Thinks in seasons rather than chores. Owns the dependency graph and the order operations must happen in.","duties":["Build the dependency graph for a multi-stage job","Identify the critical path","Flag work that cannot start yet and say what it waits on","Remember what failed last season and why"],"reads":["Silo II for prior runs","The Granary for standing procedure"],"writes":["The staged plan","The dependency graph"],"escalatesTo":"r-farmer"},{"id":"r-scribe","name":"The Scribe","title":"Decision Recorder","zone":"farmhouse","station":"fh-ledger","tier":"hand","charter":"Writes down why, not just what. The reason tomorrow's Farmer does not re-litigate today's call.","duties":["Record every material decision with its alternatives","Attach the trace that justified it","Hand finished episodes to Silo II"],"reads":["Farmhouse deliberations","Outcomes"],"writes":["Decision records","Episodes"],"escalatesTo":"r-ledger"},{"id":"r-wellkeeper","name":"The Well Keeper","title":"Capacity Rationer","zone":"farmhouse","station":"fh-well","tier":"sorter","charter":"Guards the shared draw. Rate limit headroom and budget are finite and everyone can see the level.","duties":["Issue draw permits per zone","Enforce per-zone ceilings","Signal a dry well and throttle the whole farm rather than let one zone drain it","Reserve headroom for the Gatehouse so the farm stays reachable"],"reads":["Provider limits","Live spend from the Tally Office"],"writes":["Draw permits","The dry-well signal"],"escalatesTo":"r-farmer"},{"id":"r-rowboss","name":"The Row Boss","title":"Field Sub-Orchestrator","zone":"fields","station":"fd-north","tier":"steward","charter":"Runs one field so the Farmhouse does not have to hold every row in its head. Reports one result, not fifty.","duties":["Split a batch into rows","Run rows in parallel and collect results","Retry a failed row once, then hand it to the Gleaner","Summarise the field's output into a single artifact"],"reads":["The batch assignment","Row results"],"writes":["One field-level result","A per-row status table"],"escalatesTo":"r-foreman","agent":"row-boss"},{"id":"r-plowhand","name":"The Plowhand","title":"Input Preparer","zone":"fields","station":"fd-head","tier":"hand","charter":"Prepares the ground. Normalises, chunks and orders input so every row starts from the same clean state.","duties":["Normalise formats and encodings","Chunk on meaningful boundaries, never mid-record","Order context so the stable part comes first and caches","Drop what the row will not use"],"reads":["Raw input","The row's context budget"],"writes":["Prepared context packets"],"escalatesTo":"r-rowboss","agent":"field-hand"},{"id":"r-sower","name":"The Sower","title":"Generator","zone":"fields","station":"fd-north","tier":"hand","charter":"First-pass generation at volume. Produces candidates; does not judge them.","duties":["Generate to the spec it was given","Produce alternatives where the spec allows","State its own confidence","Never silently narrow the spec"],"reads":["A prepared context packet","The spec"],"writes":["Draft artifacts"],"escalatesTo":"r-rowboss","agent":"field-hand"},{"id":"r-reaper","name":"The Reaper","title":"Extractor","zone":"fields","station":"fd-east","tier":"hand","charter":"Pulls structure out of unstructured input and guarantees it matches the schema.","duties":["Extract to a declared schema","Validate before emitting, never after","Emit a reject with a reason rather than a guess","Preserve provenance for every field it fills"],"reads":["Documents, transcripts, pages","The target schema"],"writes":["Validated records","The rejects pile"],"escalatesTo":"r-rowboss","agent":"field-hand"},{"id":"r-thresher","name":"The Thresher","title":"Reducer","zone":"fields","station":"fd-south","tier":"specialist","charter":"Many into one. Merges, ranks, synthesises — and says what it discarded.","duties":["Merge row outputs under a stated rule","Resolve contradictions explicitly rather than averaging them","Record what was dropped and why","Keep the result traceable to its sources"],"reads":["All row outputs","The merge rule"],"writes":["One synthesised artifact","A discard log"],"escalatesTo":"r-rowboss","agent":"field-hand"},{"id":"r-gleaner","name":"The Gleaner","title":"Failure Recoverer","zone":"fields","station":"fd-fallow","tier":"hand","charter":"Walks the field after harvest and picks up everything dropped. The reason nothing leaves the farm unaccounted for.","duties":["Re-attempt rejects with a different approach, not the same one again","Split work that was too large the first time","Declare permanent failure rather than loop","Send every permanent failure to the Compost Heap"],"reads":["Rejects","Timeouts","Partial results"],"writes":["Recovered work","Permanent-failure records"],"escalatesTo":"r-rowboss","agent":"gleaner"},{"id":"r-scarecrow","name":"The Scarecrow","title":"Input Guard","zone":"fields","station":"fd-crow","tier":"sorter","charter":"Stands at the field edge. Treats all external content as data, never as instruction.","duties":["Detect instructions embedded in content and neutralise them","Quarantine anything attempting to redirect a row's task","Strip content that tries to widen the row's tool scope","Report every catch to the Watchtower"],"reads":["Everything arriving at a row"],"writes":["Cleaned input","Quarantine records"],"escalatesTo":"r-fencewright","agent":"scarecrow"},{"id":"r-composter","name":"The Composter","title":"Failure Metabolist","zone":"fields","station":"fd-compost","tier":"specialist","charter":"Turns failure into eval cases. A failure that does not become a test will happen again.","duties":["Root-cause each permanent failure","Write it up as a reproducible eval case","Group failures into patterns worth a prompt change","Hand patterns to the Grafter"],"reads":["Permanent failures","Their traces"],"writes":["Eval cases","Failure pattern reports"],"escalatesTo":"r-grader"},{"id":"r-herdsman","name":"The Herdsman","title":"Session Manager","zone":"barn","station":"bn-barn","tier":"hand","charter":"Keeps durable agents alive, named and resumable across days.","duties":["Open and name a session with its assignment attached","Checkpoint state so a session survives a restart","Resume cleanly without replaying the whole history","Retire a session and free its stall"],"reads":["Assignments","Silo I state"],"writes":["Session records","Checkpoints"],"escalatesTo":"r-sheepdog"},{"id":"r-sheepdog","name":"The Sheepdog","title":"Supervisor","zone":"barn","station":"bn-kennel","tier":"sorter","charter":"Watches for the three ways a long-running agent goes wrong: stuck, looping, or quietly working on the wrong thing.","duties":["Compare current activity against the original assignment","Nudge a wandering agent back before killing it","Enforce step and wall-clock ceilings","Kill, and record why — never kill silently"],"reads":["Heartbeats","Step counts","The assignment"],"writes":["Nudges","Timeouts","Kill records"],"escalatesTo":"r-bellringer","agent":"sheepdog"},{"id":"r-milker","name":"The Milkmaid","title":"Scheduled Runner","zone":"barn","station":"bn-coop","tier":"hand","charter":"Runs the work that happens on a cadence rather than on request.","duties":["Fire scheduled jobs on time and exactly once","Skip rather than stack when the previous run is still going","Record a skipped run as loudly as a failed one","Carry forward state between firings"],"reads":["Schedules","Prior run state"],"writes":["Run records","Skip records"],"escalatesTo":"r-herdsman"},{"id":"r-vet","name":"The Vet","title":"Health & Drift Checker","zone":"barn","station":"bn-vet","tier":"specialist","charter":"Health, not behaviour. Catches the slow problems: context bloat, quality drift, a poisoned working set.","duties":["Probe liveness on a schedule","Track rolling quality against the Grading Bench baseline","Watch context size trend upward and flag it","Refer a drifting agent back to the Greenhouse rather than patching it in place"],"reads":["Probes","Rolling scores","Context metrics"],"writes":["Health records","Drift referrals"],"escalatesTo":"r-nurseryman","agent":"sheepdog"},{"id":"r-stablehand","name":"The Stablehand","title":"Workspace Steward","zone":"barn","station":"bn-paddock","tier":"sorter","charter":"Owns the physical stalls: containers, workspaces, temp files. Cleans up after everyone.","duties":["Provision a workspace per session","Keep idle sessions warm but cheap","Reclaim stalls nobody has come for","Guarantee no workspace outlives its session"],"reads":["Session lifecycle events"],"writes":["Workspace records","Reclamation logs"],"escalatesTo":"r-herdsman"},{"id":"r-granarykeeper","name":"The Granary Keeper","title":"Procedural Memory Keeper","zone":"silo","station":"si-granary","tier":"hand","charter":"Holds how we do things: versioned prompts, role charters, rubrics and blueprints. Every agent is grown from a seed kept here.","duties":["Version every prompt and charter with a diffable history","Refuse an unversioned change","Serve the current seed to the Nurseryman","Roll back on request without ceremony"],"reads":["Promoted prompts","Rubrics that held"],"writes":["The seed vault","Version history"],"escalatesTo":"r-winnower"},{"id":"r-chronicler","name":"The Chronicler","title":"Episodic Memory Keeper","zone":"silo","station":"si-episodic","tier":"sorter","charter":"Records what happened, in order, with the arguments and the results. The thing you need most at 2am and vectors are worst at.","duties":["Append ordered, timestamped events","Keep tool calls with their actual arguments and returns","Never overwrite — episodes are append-only","Make any run replayable from the record alone"],"reads":["Events from every zone"],"writes":["The episode log"],"escalatesTo":"r-winnower","agent":"chronicler"},{"id":"r-winnower","name":"The Winnower","title":"Memory Consolidator","zone":"silo","station":"si-semantic","tier":"specialist","charter":"Separates the grain from the chaff. Distils episodes into durable facts and throws the rest away.","duties":["Promote a fact to Silo III only when it is useful without its original context","Detect and surface contradictions rather than overwriting","Prune facts nothing has read in a season","Never promote something a single run asserted once"],"reads":["Silo II episodes","Existing facts"],"writes":["Promoted facts","Contradiction reports"],"escalatesTo":"r-farmer","agent":"chronicler"},{"id":"r-hydrant","name":"The Water Carrier","title":"Retrieval Agent","zone":"silo","station":"si-semantic","tier":"sorter","charter":"Fetches exactly the context an agent asked for, and no more. The difference between a cheap farm and an expensive one.","duties":["Retrieve against the question actually asked","Rank and cut to the requested budget","Return provenance with every passage","Say 'nothing relevant' instead of returning weak matches"],"reads":["Silo III","The Granary"],"writes":["Context packets with provenance"],"escalatesTo":"r-winnower","agent":"chronicler"},{"id":"r-cellarer","name":"The Cellarer","title":"Archivist","zone":"silo","station":"si-cellar","tier":"sorter","charter":"Retention and deletion. The only role on the farm authorised to destroy a record.","duties":["Age records out on the declared schedule","Honour legal holds over retention windows","Execute deletion requests and prove it","Keep the archive readable, not just stored"],"reads":["Retention policy","Deletion requests"],"writes":["Archives","Deletion proofs"],"escalatesTo":"r-gatekeeper"},{"id":"r-statekeeper","name":"The Statekeeper","title":"Working Memory Steward","zone":"silo","station":"si-working","tier":"sorter","charter":"Holds the scratch state of runs in flight, and empties it when they end.","duties":["Checkpoint in-flight state so a crash is survivable","Build a handoff packet when work changes hands","Expire scratch state at run end — no exceptions","Keep one run's scratch invisible to another"],"reads":["In-flight intermediate results"],"writes":["Checkpoints","Handoff packets"],"escalatesTo":"r-herdsman","agent":"chronicler"},{"id":"r-smith","name":"The Smith","title":"Tool Builder","zone":"toolshed","station":"ts-smithy","tier":"specialist","charter":"Forges the tools. A tool is not done until its failure modes are written down.","duties":["Build function tools and MCP servers to a named gap","Make errors informative enough for an agent to recover from","Test against the real external service, not a mock","Document every way the tool can fail"],"reads":["Capability gaps","External API docs"],"writes":["Tools","MCP servers","Failure-mode notes"],"escalatesTo":"r-quartermaster","agent":"smith"},{"id":"r-sharpener","name":"The Sharpener","title":"Tool Curator","zone":"toolshed","station":"ts-shed","tier":"specialist","charter":"Tool descriptions are prompts. Keeps them short, unambiguous and honest about cost.","duties":["Write descriptions an agent can choose correctly from","Collapse near-duplicate tools","Watch for tools that are never picked and find out why","Retire dull tools — a crowded toolbelt costs every call"],"reads":["Tool usage data","Mis-selection traces"],"writes":["Sharpened schemas","Deprecation notices"],"escalatesTo":"r-quartermaster"},{"id":"r-quartermaster","name":"The Quartermaster","title":"Tool Registry & Permissions","zone":"toolshed","station":"ts-hut","tier":"hand","charter":"Issues a toolbelt scoped to the chore at hand, and takes it back afterwards.","duties":["Issue the minimum toolbelt a chore needs","Time-box every issue","Log every issue and return","Refuse a request for tools outside the chore's scope"],"reads":["Chores","The registry","Role scopes"],"writes":["Toolbelts","The tool audit log"],"escalatesTo":"r-gatekeeper"},{"id":"r-wright","name":"The Wright","title":"Integration Engineer","zone":"toolshed","station":"ts-smithy","tier":"hand","charter":"Makes stubborn external systems behave. Adapters, retries, pagination, auth refresh.","duties":["Wrap external APIs behind a stable internal shape","Handle pagination and partial failure inside the adapter","Own credential refresh so no agent ever sees a raw secret","Absorb upstream breaking changes without the farm noticing"],"reads":["External API behaviour","Failure reports"],"writes":["Adapters","Integration health notes"],"escalatesTo":"r-smith","agent":"smith"},{"id":"r-driver","name":"The Tractor Driver","title":"Batch & Sandbox Operator","zone":"toolshed","station":"ts-yard","tier":"hand","charter":"Runs the heavy and the dangerous: batch jobs and code execution, always inside a sandbox.","duties":["Route large volume to batch rather than live calls","Execute untrusted code only in the yard, never in a zone","Cap runtime and output size","Return results keyed to their request, never by position"],"reads":["Batch jobs","Code to execute"],"writes":["Batch results","Sandbox execution records"],"escalatesTo":"r-fencewright"},{"id":"r-grafter","name":"The Grafter","title":"Prompt Engineer","zone":"greenhouse","station":"gh-glasshouse","tier":"specialist","charter":"Designs and tunes the prompts every role is grown from. Changes one thing at a time and measures it.","duties":["Write a charter before writing a prompt","Change one variable per iteration","Measure against the bench, not against intuition","Delete instructions that no longer earn their tokens"],"reads":["Failure patterns","Bench scores","The current seed"],"writes":["Candidate prompts","Tuning notes"],"escalatesTo":"r-nurseryman","agent":"grafter"},{"id":"r-nurseryman","name":"The Nurseryman","title":"Agent Incubator","zone":"greenhouse","station":"gh-beds","tier":"steward","charter":"Grows a candidate from prompt to production-ready. Owns the gate between the greenhouse and the fields.","duties":["Run candidates in shadow against real traffic","Hold the release bar and refuse to lower it under pressure","Stage a rollout by percentage, never all at once","Roll back when live numbers disagree with the bench"],"reads":["Candidates","Shadow transcripts","Bench scores"],"writes":["Release decisions","Rollout plans"],"escalatesTo":"r-farmer"},{"id":"r-grader","name":"The Grader","title":"Evaluator","zone":"greenhouse","station":"gh-bench","tier":"specialist","charter":"Scores work against a written rubric. Independent of whoever produced it, on purpose.","duties":["Grade against a rubric written before the output existed","Report a breakdown, not just a number","Flag when the rubric itself is the problem","Never grade its own zone's output alone"],"reads":["Candidate output","The golden set","The rubric"],"writes":["Scores with breakdowns","Rubric defect reports"],"escalatesTo":"r-nurseryman","agent":"grader"},{"id":"r-soiltester","name":"The Soil Tester","title":"Dataset Curator","zone":"greenhouse","station":"gh-bench","tier":"hand","charter":"Owns the golden set. Keeps it drawn from real traffic rather than from imagination.","duties":["Harvest cases from real runs and real failures","Keep a held-out split nobody tunes against","Refresh cases as the work changes","Refuse synthetic-only eval sets"],"reads":["Real traffic","Compost Heap cases"],"writes":["The golden set","Train/held-out splits"],"escalatesTo":"r-grader","agent":"grader"},{"id":"r-pruner","name":"The Pruner","title":"Simplifier","zone":"greenhouse","station":"gh-frames","tier":"specialist","charter":"Removes what no longer earns its place. Dead agents, redundant steps, instructions nobody follows.","duties":["Find roles that have not run in a season","Collapse two roles that do one job","Delete prompt text that measurement shows is inert","Argue for fewer agents, not more"],"reads":["Usage data","Bench scores before and after removal"],"writes":["Pruning proposals","Removal records"],"escalatesTo":"r-nurseryman","agent":"grafter"},{"id":"r-pollinator","name":"The Pollinator","title":"Cross-Zone Propagator","zone":"greenhouse","station":"gh-frames","tier":"hand","charter":"Carries what works from one zone to another. Stops every crew from solving the same problem privately.","duties":["Spot a technique that lifted one zone's scores","Test whether it transfers before recommending it","Write it into the Granary as standing procedure","Retire practices that stopped working"],"reads":["Per-zone score movements","Tuning notes"],"writes":["Propagation proposals","Granary procedure updates"],"escalatesTo":"r-granarykeeper"},{"id":"r-watchman","name":"The Watchman","title":"Tracer","zone":"watchtower","station":"wt-tower","tier":"sorter","charter":"Captures every run end to end, with the reasoning attached. If it is not traced, it did not happen.","duties":["Emit a span per agent action with inputs, outputs and the stated reason","Preserve causality across zone handoffs","Make any run replayable from the trace alone","Sample nothing that failed — failures are always kept in full"],"reads":["Events from every zone"],"writes":["Traces","Span trees"],"escalatesTo":"r-surveyor","agent":"watchman"},{"id":"r-weathervane","name":"The Weathervane","title":"Forecaster","zone":"watchtower","station":"wt-mill","tier":"sorter","charter":"Reads the trend and warns before it becomes an incident.","duties":["Forecast load from throughput and queue depth","Detect anomalies against the zone's own baseline","Warn the Dispatcher early enough to matter","Distinguish a spike from a trend"],"reads":["Throughput history","Queue depth","Error rates"],"writes":["Forecasts","Anomaly flags"],"escalatesTo":"r-bellringer"},{"id":"r-tally","name":"The Tally Clerk","title":"Cost Accountant","zone":"watchtower","station":"wt-tally","tier":"sorter","charter":"Counts what everything cost, per completed task rather than per request.","duties":["Attribute tokens and wall time to a zone and a chore","Report cost per completed task, which is the only honest number","Track cache hit rate and flag silent invalidation","Issue the stop order when a budget is spent"],"reads":["Usage per span","Budgets"],"writes":["Cost reports","Burn-down","Stop orders"],"escalatesTo":"r-bellringer","agent":"watchman"},{"id":"r-bellringer","name":"The Bell Ringer","title":"Alerting","zone":"watchtower","station":"wt-bell","tier":"sorter","charter":"Wakes a human, rarely. Owns the judgement of what is worth someone's night.","duties":["Page only on breached thresholds that a human can act on","Attach the trace link to every page","Suppress duplicates and storms","Keep the bar high — a bell that rings often stops being heard"],"reads":["Thresholds","Anomaly flags","Kill records"],"writes":["Pages","Incident records"],"escalatesTo":"A human"},{"id":"r-surveyor","name":"The Surveyor","title":"Quality Reporter","zone":"watchtower","station":"wt-tower","tier":"specialist","charter":"Turns telemetry into a picture a human can act on. Owns the weekly read on whether the farm is getting better.","duties":["Maintain SLOs per zone","Report trend, not just current state","Tie quality movements to what changed","Say plainly when a change made things worse"],"reads":["Traces","Scores","Cost reports"],"writes":["Dashboards","The weekly report"],"escalatesTo":"r-farmer","agent":"watchman"},{"id":"r-gatekeeper","name":"The Gatekeeper","title":"Identity & Authorisation","zone":"gatehouse","station":"gt-gate","tier":"hand","charter":"Decides who is asking and what they are allowed to ask for. Everything inbound passes here.","duties":["Authenticate every external request","Attach scopes that travel with the goal through the whole farm","Refuse with a reason rather than failing silently","Never let a scope widen once inside"],"reads":["Credentials","Policy"],"writes":["Authenticated, scoped goals","Refusals"],"escalatesTo":"A human"},{"id":"r-fencewright","name":"The Fencewright","title":"Isolation Engineer","zone":"gatehouse","station":"gt-fence","tier":"specialist","charter":"Owns blast radius. Network egress, filesystem reach and credential scope, enforced per zone.","duties":["Define what each zone may reach","Enforce egress allowlists at the boundary, not in prompts","Keep credentials out of agent-visible context entirely","Alarm on any attempt to cross a fence"],"reads":["Isolation policy","Egress attempts"],"writes":["Sandbox configuration","Breach alarms"],"escalatesTo":"r-gatekeeper"},{"id":"r-tolltaker","name":"The Toll Taker","title":"Rate Limiter","zone":"gatehouse","station":"gt-gate","tier":"sorter","charter":"Fair share at the entrance. Stops one caller consuming the farm.","duties":["Throttle per caller, not just in aggregate","Return a retry-after rather than a bare failure","Reserve headroom so the farm stays reachable under load","Escalate sustained abuse rather than absorbing it"],"reads":["Per-caller request rates"],"writes":["Throttle decisions","Abuse reports"],"escalatesTo":"r-gatekeeper"},{"id":"r-inspector","name":"The Inspector","title":"Outbound Guard","zone":"gatehouse","station":"gt-scale","tier":"specialist","charter":"Nothing leaves unweighed. The last check before the farm's work becomes someone else's problem.","duties":["Scan every outbound artifact for secrets and personal data","Block claims the farm cannot support with a trace","Redact rather than block where redaction is enough","Record every block with its reason"],"reads":["Outbound artifacts","Policy"],"writes":["Cleared artifacts","Redactions","Block records"],"escalatesTo":"r-gatekeeper","agent":"inspector"},{"id":"r-marketkeeper","name":"The Marketkeeper","title":"Delivery Interface","zone":"gatehouse","station":"gt-stall","tier":"hand","charter":"Hands the finished work to whoever asked for it, in the shape they wanted it.","duties":["Deliver in the requested format and channel","Attach a receipt linked to the run's trace","Confirm delivery rather than assuming it","Hold artifacts the Inspector has not cleared"],"reads":["Cleared artifacts","Delivery preferences"],"writes":["Deliveries","Receipts"],"escalatesTo":"r-gatekeeper"},{"id":"r-herald","name":"The Herald","title":"Human Notifier","zone":"gatehouse","station":"gt-stall","tier":"sorter","charter":"Tells the humans what the farm did, without making them come and look.","duties":["Summarise a run in the fewest words that stay true","Notify on completion of long work","Never notify for routine progress","Lead with what the reader would act on"],"reads":["Run outcomes","The Surveyor's report"],"writes":["Notifications","Summaries"],"escalatesTo":"r-marketkeeper"},{"id":"r-dowser","name":"The Dowser","title":"Prospect Finder","zone":"market","station":"mk-wayside","tier":"sorter","agent":"dowser","charter":"Finds businesses with a problem you can name, prove, and fix. A prospect without a specific verifiable defect is a stranger, not a lead.","duties":["Search a named trade in a named geography","Confirm the business is real and currently trading","Find one concrete, checkable defect before listing anyone","Discard the ones already doing it right — they are not prospects, they are proof the standard is achievable","Never guess at a contact detail"],"reads":["Public listings, directories, search results","Their own website"],"writes":["A prospect list, each row carrying its evidence"],"escalatesTo":"r-appraiser"},{"id":"r-appraiser","name":"The Appraiser","title":"Lead Qualifier","zone":"market","station":"mk-book","tier":"sorter","charter":"Decides who is worth the trip. Being fixable is not the same as being worth fixing, and neither is the same as being able to pay.","duties":["Check the business is trading and has revenue to spend","Weigh the size of the defect against the effort to fix it","Rule out anyone already paying an agency for this","Kill a lead early rather than carry it","State the reason for every kill"],"reads":["The prospect list","Public signals of size and activity"],"writes":["Qualified leads, with a reason","Killed leads, with a reason"],"escalatesTo":"r-factor"},{"id":"r-assayer","name":"The Assayer","title":"Diagnostic Surveyor","zone":"market","station":"mk-bench","tier":"specialist","agent":"surveyor","charter":"Measures the problem instead of asserting it. Produces the artifact the whole business rests on — if the audit is generic, there is nothing to sell.","duties":["Run the audit against what is actually published, never against an assumption","Report the specific evidence for every finding","Say what each defect costs in customers, not in jargon","Rank by what it costs, not by how hard it is to fix","Say plainly when a site is already fine"],"reads":["The prospect's public pages"],"writes":["A scored audit with evidence and fixes per finding"],"escalatesTo":"r-factor"},{"id":"r-factor","name":"The Factor","title":"Outreach & Follow-up","zone":"market","station":"mk-stand","tier":"specialist","agent":"factor","charter":"Takes the work to market. Historically the agent who sold a farmer's crop on their behalf — here, the one who turns a finished audit into a conversation.","duties":["Lead with the single most expensive defect, in the owner's language","Give the finding away for free and charge for the fix","Never describe how the work was done — it is irrelevant to the buyer","Follow up twice, then stop, and record the stop","Keep every claim inside what the audit actually establishes"],"reads":["The audit","The pipeline","Prior contact history"],"writes":["Approaches","Follow-ups","Outcomes on the order book"],"escalatesTo":"r-farmer"},{"id":"r-auctioneer","name":"The Auctioneer","title":"Pricing & Quotes","zone":"market","station":"mk-book","tier":"specialist","charter":"Sets the price. Prices the outcome the buyer gets, never the hours the farm spent.","duties":["Quote one number for a defined scope","Price against what the defect costs them, not what the work costs you","Hold a floor and say no below it","Offer a recurring option where the work actually recurs","Never discount silently — trade scope for price, visibly"],"reads":["The audit","Prior deals","What the market pays"],"writes":["Quotes","Scope definitions"],"escalatesTo":"r-factor"},{"id":"r-reeve","name":"The Reeve","title":"Account Steward","zone":"market","station":"mk-stand","tier":"hand","charter":"Keeps the customer after the sale. A second month from an existing customer costs nothing to acquire and is the only thing that turns work into a business.","duties":["Deliver what was quoted, then confirm it landed","Re-run the audit after the fix and show the movement","Ask for the referral while the result is fresh","Notice a lapsing account before it lapses","Close an account honestly rather than let it rot"],"reads":["Delivered work","The order book","Re-audit results"],"writes":["Delivery receipts","Renewal and referral records"],"escalatesTo":"r-factor"}],"tasks":[{"id":"t-intake-goal","name":"Take in a goal","station":"fh-house","owner":"r-farmer","trigger":"A scoped goal arrives from the Gatehouse","input":"Intent, scopes, delivery preference","output":"The goal restated in farm terms, with success stated explicitly","doneWhen":"Success is written down in a form the Grader could check","watchFor":"Restating the goal more narrowly than it was asked"},{"id":"t-decompose","name":"Break a goal into chores","station":"fh-house","owner":"r-farmer","trigger":"A restated goal exists","input":"The goal, the dependency graph, known capacity","output":"Independent chores, each with an owner and a definition of done","doneWhen":"No chore depends on another chore in the same batch","watchFor":"Hidden dependencies that turn a parallel field into a queue"},{"id":"t-decide-done","name":"Call ark an idle session","station":"bn-paddock","owner":"r-stablehand","trigger":"A session goes idle","input":"Session state","output":"A warm, cheap, resumable session","doneWhen":"Resume is fast and the idle cost is near zero","watchFor":"Idle sessions holding workspaces nobody will come back for"},{"id":"t-schedule-job","name":"Register recurring work","station":"bn-coop","owner":"r-milker","trigger":"A standing instruction with a cadence","input":"Schedule, instruction","output":"A registered job","doneWhen":"The schedule is stored in UTC and the next firing is known","watchFor":"Local-time schedules that drift twice a year"},{"id":"t-fire-scheduled","name":"Fire a scheduled run","station":"bn-coop","owner":"r-milker","trigger":"The schedule comes due","input":"The instruction, prior run state","output":"A run record, or a skip record","doneWhen":"It fired exactly once, or the skip is recorded as loudly as a failure","watchFor":"Stacking a new run on top of one still going"},{"id":"t-herd-stray","name":"Nudge a wandering agent","station":"bn-kennel","owner":"r-sheepdog","trigger":"Activity diverges from the assignment","input":"Current activity, the original assignment","output":"A nudge back on task","doneWhen":"The agent is working the assignment again, or is killed","watchFor":"An agent making steady progress on the wrong thing"},{"id":"t-kill-runaway","name":"Kill a runaway","station":"bn-kennel","owner":"r-sheepdog","trigger":"A step or wall-clock ceiling is breached","input":"Step count, elapsed time","output":"A kill, with the reason recorded","doneWhen":"The agent is stopped and the kill reason is on the record","watchFor":"Killing silently and leaving nothing to diagnose"},{"id":"t-health-check","name":"Probe health","station":"bn-vet","owner":"r-vet","trigger":"On a schedule","input":"Liveness probes, context size, rolling score","output":"A health record","doneWhen":"Every durable agent has a health record newer than its interval","watchFor":"A responsive agent whose output quality has quietly fallen"},{"id":"t-detect-drift","name":"Detect quality drift","station":"bn-vet","owner":"r-vet","trigger":"Rolling score falls against the bench baseline","input":"Rolling scores, the baseline","output":"A drift referral to the Greenhouse","doneWhen":"The drift is reproduced on the bench","watchFor":"Patching a drifting agent in place instead of regrowing it"},{"id":"t-checkpoint-state","name":"Checkpoint in-flight state","station":"si-working","owner":"r-statekeeper","trigger":"A run reaches a stage boundary","input":"Intermediate results","output":"A checkpoint and, on handoff, a packet","doneWhen":"A crash at this point loses no completed stage","watchFor":"Scratch state from one run visible to another"},{"id":"t-record-episode","name":"Record what happened","station":"si-episodic","owner":"r-chronicler","trigger":"Any agent action completes","input":"Event, arguments, result, timestamp","output":"An append-only episode entry","doneWhen":"The run is replayable from the log alone","watchFor":"Summarising an episode at write time and losing the detail"},{"id":"t-promote-fact","name":"Promote an episode to a fact","station":"si-semantic","owner":"r-winnower","trigger":"Consolidation runs","input":"Episodes, existing facts","output":"A promoted fact, or a contradiction report","doneWhen":"The fact is useful without its original context and does not contradict an existing one","watchFor":"Promoting something a single run asserted once"},{"id":"t-retrieve-context","name":"Retrieve context","station":"si-semantic","owner":"r-hydrant","trigger":"An agent asks for context","input":"The question, a budget","output":"A ranked packet with provenance","doneWhen":"It fits the budget and every passage cites its source","watchFor":"Returning weak matches instead of saying nothing is relevant"},{"id":"t-version-prompt","name":"Version a prompt or charter","station":"si-granary","owner":"r-granarykeeper","trigger":"A prompt or charter changes","input":"The new text, the reason","output":"A versioned, diffable entry","doneWhen":"The change is diffable against the previous version and reversible","watchFor":"An unversioned edit made directly in production"},{"id":"t-age-out","name":"Age records out","station":"si-cellar","owner":"r-cellarer","trigger":"Retention window expires","input":"Retention policy, legal holds","output":"An archived or deleted record, with proof","doneWhen":"Deletion is proven and holds are honoured over the schedule","watchFor":"Deleting something under legal hold"},{"id":"t-forge-tool","name":"Forge a tool","station":"ts-smithy","owner":"r-smith","trigger":"A zone names a capability gap","input":"The gap, the external service","output":"A working tool with tested failure modes","doneWhen":"It has been tested against the real service and its errors are recoverable","watchFor":"A tool tested only against a mock"},{"id":"t-write-tool-schema","name":"Write the tool's description","station":"ts-smithy","owner":"r-sharpener","trigger":"A tool is built or mis-selected","input":"The tool, mis-selection traces","output":"A description an agent can choose correctly from","doneWhen":"An agent picks it correctly without picking it wrongly elsewhere","watchFor":"Two tools whose descriptions overlap"},{"id":"t-register-tool","name":"Register a tool","station":"ts-shed","owner":"r-sharpener","trigger":"A tool is ready","input":"Tool, schema, cost profile","output":"A registry entry","doneWhen":"Cost and permitted roles are recorded alongside it","watchFor":"Registry entries for tools nothing has called in a season"},{"id":"t-issue-toolbelt","name":"Issue a toolbelt","station":"ts-shed","owner":"r-quartermaster","trigger":"A chore is assigned","input":"The chore, the role's scope","output":"The minimum toolbelt the chore needs","doneWhen":"No tool is issued that the chore does not need","watchFor":"Issuing the full catalogue because it is easier"},{"id":"t-scope-tools","name":"Time-box and ret
