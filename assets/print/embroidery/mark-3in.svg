  <title>Everglow bulb mark, left chest, 3in</title>
  <defs>
    <radialGradient id="bulbFill" cx="50%" cy="54%" r="52%">
      <stop offset="0%" stop-color="#FFF7E9"/>
      <stop offset="48%" stop-color="#FFC46B"/>
      <stop offset="100%" stop-color="#E8A33F"/>
    </radialGradient>
  </defs>
  <!-- NOTE TO DIGITISER: thread cannot render the gradient above.
       Render the bulb in 2-3 amber tones, lightest at upper left. -->
  <rect x="26.5" y="7" width="11" height="4" rx="1.6" fill="#F7F9FC"/>
  <path d="M26 12h12a2 2 0 0 1 2 2v3H24v-3a2 2 0 0 1 2-2z" fill="#F7F9FC"/>
  <circle cx="32" cy="35" r="17" fill="url(#bulbFill)"/>
