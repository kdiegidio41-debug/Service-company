      <stop offset="0%" stop-color="#FFE7C2"/>
      <stop offset="55%" stop-color="#FFC46B"/>
      <stop offset="100%" stop-color="#E8A33F"/>
    </radialGradient>
    <radialGradient id="egHalo" cx="50%" cy="54%" r="50%">
      <stop offset="0%" stop-color="#FFC46B" stop-opacity=".55"/>
      <stop offset="60%" stop-color="#FFC46B" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#FFC46B" stop-opacity="0"/>
